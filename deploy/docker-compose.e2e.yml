services:
    lifemem-e2e-postgres:
        image: postgres:18
        container_name: lifemem-e2e-postgres
        environment:
            POSTGRES_USER: ${POSTGRES_USER}
            POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
            POSTGRES_DB: ${POSTGRES_DB}
        volumes:
            - lifemem_e2e_pgdata:/var/lib/postgresql
        ports:
            - '${POSTGRES_PORT:-5433}:5432'
        healthcheck:
            test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
            interval: 5s
            timeout: 5s
            retries: 10

    lifemem-e2e-redis:
        image: redis:alpine
        container_name: lifemem-e2e-redis
        ports:
            - '${REDIS_PORT:-6380}:6379'
        healthcheck:
            test: ['CMD', 'redis-cli', 'ping']
            interval: 5s
            timeout: 5s
            retries: 10

    lifemem-e2e-minio:
        build:
            context: .
            dockerfile: Dockerfile.minio
        image: lifemem-minio:local
        container_name: lifemem-e2e-minio
        environment:
            MINIO_ROOT_USER: ${S3_ACCESS_KEY_ID}
            MINIO_ROOT_PASSWORD: ${S3_SECRET_ACCESS_KEY}
            S3_BUCKET: ${S3_BUCKET}
        volumes:
            - lifemem_e2e_minio_data:/data
        ports:
            - '${S3_PORT:-9002}:9000'
            - '${S3_CONSOLE_PORT:-9003}:9001'
        healthcheck:
            test: ['CMD', 'curl', '-f', 'http://127.0.0.1:9000/minio/health/live']
            interval: 5s
            timeout: 5s
            retries: 12
            start_period: 15s

volumes:
    lifemem_e2e_pgdata:
    lifemem_e2e_minio_data:
