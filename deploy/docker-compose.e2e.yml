services:
    lifemem-e2e-postgres:
        image: pgvector/pgvector:pg18
        container_name: lifemem-e2e-postgres
        env_file:
            - .env.e2e
        volumes:
            - lifemem_e2e_pgdata:/var/lib/postgresql
        ports:
            - '${POSTGRES_PORT:-5433}:5432'
        healthcheck:
            test: ['CMD-SHELL', 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
            interval: 5s
            timeout: 5s
            retries: 10

    lifemem-e2e-redis:
        image: redis:alpine
        container_name: lifemem-e2e-redis
        ports:
            - '${REDIS_PORT:-6380}:6379'
        healthcheck:
            test: ['CMD', 'redis-cli', 'ping']
            interval: 5s
            timeout: 5s
            retries: 10

    lifemem-e2e-minio:
        image: minio/minio:RELEASE.2025-04-22T22-12-26Z-cpuv1
        container_name: lifemem-e2e-minio
        env_file:
            - .env.e2e
        environment:
            MINIO_ROOT_USER: ${S3_ACCESS_KEY_ID}
            MINIO_ROOT_PASSWORD: ${S3_SECRET_ACCESS_KEY}
        volumes:
            - lifemem_e2e_minio_data:/data
        ports:
            - '${S3_PORT:-9002}:9000'
            - '${S3_CONSOLE_PORT:-9003}:9001'
        command: server /data --console-address ':9001'
        healthcheck:
            test: ['CMD', 'curl', '-f', 'http://127.0.0.1:9000/minio/health/live']
            interval: 5s
            timeout: 5s
            retries: 12
            start_period: 5s

volumes:
    lifemem_e2e_pgdata:
    lifemem_e2e_minio_data:
