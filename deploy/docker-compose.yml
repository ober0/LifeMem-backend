services:
    lifemem-postgres:
        image: pgvector/pgvector:pg18
        container_name: lifemem-postgres
        restart: unless-stopped
        env_file:
            - .env.prod
        volumes:
            - lifemem_pgdata:/var/lib/postgresql
        healthcheck:
            test: ['CMD-SHELL', 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
            interval: 10s
            timeout: 5s
            retries: 5

    lifemem-redis:
        image: redis:alpine
        container_name: lifemem-redis
        restart: unless-stopped
        healthcheck:
            test: ['CMD', 'redis-cli', 'ping']
            interval: 10s
            timeout: 5s
            retries: 5

    lifemem-minio:
        build:
            context: ./deploy
            dockerfile: Dockerfile.minio
        image: lifemem-minio:local
        container_name: lifemem-minio
        restart: unless-stopped
        ports:
            - '127.0.0.1:${S3_HOST_PORT:-9100}:9000'
            - '127.0.0.1:${S3_CONSOLE_HOST_PORT:-9101}:9001'
        env_file:
            - .env.prod
        volumes:
            - lifemem_minio_data:/data
        healthcheck:
            test: ['CMD', 'curl', '-f', 'http://127.0.0.1:9000/minio/health/live']
            interval: 10s
            timeout: 5s
            retries: 10
            start_period: 15s

    lifemem-app:
        build:
            context: .
            dockerfile: deploy/Dockerfile
        image: lifemem-app:local
        container_name: lifemem-app
        restart: unless-stopped
        env_file:
            - .env.prod
        environment:
            NODE_ENV: production
        ports:
            - '127.0.0.1:${VM_PORT:-3000}:${PORT:-3000}'
        depends_on:
            lifemem-postgres:
                condition: service_healthy
            lifemem-redis:
                condition: service_healthy
            lifemem-minio:
                condition: service_healthy

    lifemem-cron:
        image: lifemem-app:local
        container_name: lifemem-cron
        restart: unless-stopped
        env_file:
            - .env.prod
        environment:
            NODE_ENV: production
            DATABASE_URL: ${CRON_WORKER_DATABASE_URL}
        command: ['node', 'dist/src/cron-worker.js']
        depends_on:
            lifemem-postgres:
                condition: service_healthy
            lifemem-app:
                condition: service_started

    lifemem-telegram:
        image: lifemem-app:local
        container_name: lifemem-telegram
        restart: unless-stopped
        env_file:
            - .env.prod
        environment:
            NODE_ENV: production
        command: ['node', 'dist/src/telegram-worker.js']
        depends_on:
            lifemem-app:
                condition: service_started

volumes:
    lifemem_pgdata:
    lifemem_minio_data:
