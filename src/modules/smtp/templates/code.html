<!DOCTYPE html>
<html lang="{{LANG}}">
<head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <meta name="color-scheme" content="light"/>
    <title>LifeMem</title>
</head>
<body style="margin:0;padding:0;background-color:#dfe8ea;-webkit-font-smoothing:antialiased;">
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="background-color:#dfe8ea;padding:40px 16px;">
    <tr>
        <td align="center">
            <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="max-width:520px;background-color:#ffffff;border-radius:20px;overflow:hidden;box-shadow:0 18px 50px rgba(15,47,45,0.12);">
                <tr>
                    <td style="background:linear-gradient(145deg,#0f2f2d 0%,#1a4d4a 55%,#2a6b66 100%);padding:36px 40px 32px;">
                        <p style="margin:0 0 8px;font-family:Georgia,'Times New Roman',serif;font-size:28px;line-height:1.1;letter-spacing:0.04em;color:#f3faf8;">
                            LifeMem
                        </p>
                        <p style="margin:0;font-family:Georgia,'Times New Roman',serif;font-size:14px;line-height:1.5;color:rgba(243,250,248,0.78);">
                            {{TAGLINE}}
                        </p>
                    </td>
                </tr>
                <tr>
                    <td style="padding:36px 40px 12px;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;color:#1c2b2a;">
                        <h1 style="margin:0 0 12px;font-family:Georgia,'Times New Roman',serif;font-size:24px;font-weight:normal;line-height:1.25;color:#0f2f2d;">
                            {{TITLE}}
                        </h1>
                        <p style="margin:0;font-size:15px;line-height:1.65;color:#4a5f5d;">
                            {{MESSAGE}}
                        </p>
                    </td>
                </tr>
                <tr>
                    <td style="padding:20px 40px 8px;" align="center">
                        <table role="presentation" cellpadding="0" cellspacing="0" border="0" style="background-color:#0f1f1e;border-radius:14px;">
                            <tr>
                                <td style="padding:22px 36px;font-family:'SF Mono',Menlo,Consolas,'Courier New',monospace;font-size:36px;font-weight:700;letter-spacing:0.35em;color:#b8f0e8;text-align:center;">
                                    {{CODE}}
                                </td>
                            </tr>
                        </table>
                    </td>
                </tr>
                <tr>
                    <td style="padding:16px 40px 36px;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;">
                        <p style="margin:0;font-size:13px;line-height:1.6;color:#6b7f7d;text-align:center;">
                            {{EXPIRES_HINT}}
                        </p>
                    </td>
                </tr>
                <tr>
                    <td style="border-top:1px solid #e4eeed;padding:20px 40px 28px;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;text-align:center;">
                        <p style="margin:0;font-size:12px;line-height:1.5;color:#8a9c9a;">
                            © {{YEAR}} LifeMem
                        </p>
                    </td>
                </tr>
            </table>
        </td>
    </tr>
</table>
</body>
</html>
